<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal de Inversionistas · Flipping Rentals</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/ui/tokens.css"><!-- tokens canonicos: los estilos locales de abajo SIEMPRE ganan -->
<style>
  :root{--bg:#06080d;--ink:#eef2f8;--mut:#93a0b6;--mut2:#5b6780;--glass:rgba(255,255,255,.045);--glassb:rgba(255,255,255,.09);
    --a1:#45e3c6;--a2:#4f8dff;--pos:#48d69c;--neg:#f0687a;--amber:#e7b65e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(760px 520px at 8% -6%,rgba(69,227,198,.14),transparent 58%),
    radial-gradient(820px 560px at 100% 4%,rgba(79,141,255,.15),transparent 56%),linear-gradient(180deg,#070a11,#05070c);
    color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 70px}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;color:#04121a;font-weight:900;font-size:15px}
  .brandt b{font-size:15px}.brandt span{display:block;font-size:9px;color:var(--mut2);letter-spacing:2.2px}
  .barr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ibtn{background:var(--glass);border:1px solid var(--glassb);color:var(--mut);padding:7px 12px;border-radius:10px;cursor:pointer;font-size:12px}
  .ibtn:hover{color:var(--ink);border-color:var(--a2)}
  h1{font-size:22px;font-weight:770;letter-spacing:-.3px}h1 span{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--mut);font-size:12.5px;margin:4px 0 18px}
  .grid{display:grid;gap:14px;align-items:start}.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{background:var(--glass);border:1px solid var(--glassb);border-radius:15px;padding:16px;backdrop-filter:blur(14px)}
  .lab{font-size:9.5px;letter-spacing:1.3px;color:var(--mut2);text-transform:uppercase;font-weight:700}
  .big{font-size:24px;font-weight:780;margin-top:6px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .meta{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.5}
  .up{color:var(--pos)}.down{color:var(--neg)}.warn{color:var(--amber)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0;border-top:1px solid var(--glassb)}
  .kv:first-of-type{border-top:none}.kv span{color:var(--mut)}.kv b{text-align:right;font-variant-numeric:tabular-nums}
  .src{display:inline-block;font-size:8px;font-weight:700;letter-spacing:.4px;padding:1px 6px;border-radius:8px;background:rgba(79,141,255,.14);color:var(--a2);vertical-align:middle;margin-left:4px}
  .src.sup{background:rgba(231,182,94,.14);color:var(--amber)}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{text-align:right;color:var(--mut2);font-size:9px;letter-spacing:.8px;text-transform:uppercase;padding:7px 6px;border-bottom:1px solid var(--glassb)}
  th:first-child,td:first-child{text-align:left}
  td{padding:6px;border-bottom:1px solid var(--glassb);text-align:right;font-variant-numeric:tabular-nums}
  .chart-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.chart-h .t{font-size:13px;font-weight:650}.chart-h .k{font-size:10px;color:var(--mut2)}
  .cbtn{background:linear-gradient(135deg,var(--a1),var(--a2));border:none;color:#04121a;font-weight:750;padding:10px 16px;border-radius:11px;cursor:pointer;font-size:13px}
  .login{max-width:420px;margin:10vh auto;text-align:center}
  .login input{width:100%;background:var(--glass);border:1px solid var(--glassb);border-radius:11px;padding:12px 14px;color:var(--ink);font-size:14px;outline:none;margin:14px 0 10px}
  .empty{padding:44px;text-align:center;color:var(--mut2)}
  .overx{overflow-x:auto}
  @media(max-width:900px){.k4,.k3,.k2{grid-template-columns:minmax(0,1fr)}.wrap{padding:16px 12px 50px}}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="empty">⏳ Cargando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/config.public.js"></script>
<script src="/os/inv-engine.js"></script>
<script src="/os/inv-portal.js"></script>
</body>
</html>
