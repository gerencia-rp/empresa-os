<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico Patológico de Vivienda · Rental Profits OS</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/ui/tokens.css"><!-- tokens canonicos: los estilos locales de abajo SIEMPRE ganan -->
<style>
  :root{--bg:#14110c;--card:rgba(255,255,255,.035);--line:rgba(255,255,255,.09);--txt:#e8eefc;--mut:#a69d8c;--mut2:#756c5c;--a1:#6fbf95;--a2:#2f6ef0;--pos:#63c08e;--neg:#e4756a;--amber:#dca94f}
  [data-theme="light"]{--bg:#f4f6fb;--card:#fff;--line:#e8e3d9;--txt:#211e17;--mut:#5f594c;--mut2:#a89f8f}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .top .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;font-size:22px}
  .top h1{font-size:19px}.top .sub{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:1.5px}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .sync{font-size:11px;color:var(--pos);display:flex;align-items:center;gap:5px}.sync i{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block}
  .iconbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:13px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
  .tab{padding:9px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none}
  .tab.on{color:var(--txt);border-bottom-color:var(--a1)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:1fr 1fr}
  @media(max-width:820px){.k4,.k3,.k2{grid-template-columns:1fr 1fr}}
  .kpi .lab{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut2);font-weight:700;margin-bottom:5px}
  .kpi .big{font-size:26px;font-weight:800}.kpi .meta{font-size:11px;color:var(--mut2);margin-top:3px}
  .up{color:var(--pos)}.down{color:var(--neg)}.warn{color:var(--amber)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut2);border-bottom:1px solid var(--line);padding:7px 6px}
  td{padding:8px 6px;border-bottom:1px solid var(--line)}
  .btn{background:linear-gradient(135deg,var(--a1),var(--a2));border:none;border-radius:9px;padding:9px 16px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--txt)}
  .bar{height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%}
  input,select{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--txt);font-size:13px}
  .badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px}
  .b-ok{background:rgba(52,211,153,.15);color:var(--pos)}.b-warn{background:rgba(231,182,94,.15);color:var(--amber)}.b-neg{background:rgba(248,113,113,.15);color:var(--neg)}
  .chip{font-size:10px;padding:2px 9px;border-radius:20px;background:rgba(18,181,160,.13);color:var(--a1);font-weight:700}
  .login{max-width:420px;margin:12vh auto;text-align:center}
  .aibubble{position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(18,181,160,.6);z-index:900}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="login card"><h1>Cargando…</h1></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/config.public.js"></script>
<script src="/diagnostico.js"></script>
</body>
</html>
